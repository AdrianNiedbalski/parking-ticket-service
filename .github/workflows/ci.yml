name: CI

on:
  push:

permissions:
  contents: read

jobs:
  # --- build, unit tests, coverage gate (mvn verify) ---
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, coverage gate
        run: mvn -B clean verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # --- smoke check on the built artifact, depends on build-and-test ---
  verify-artifact:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Check jar is a valid executable Spring Boot jar
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*plain*' | head -n1)
          echo "Checking $JAR"
          test -s "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q "Start-Class" \
            && echo "OK: executable Spring Boot jar" \
            || (echo "FAIL: missing Start-Class in manifest" && exit 1)

  # --- style/static analysis, independent of build-and-test, runs in parallel ---
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

  # --- known-CVE scan of resolved dependencies, independent, runs in parallel ---
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve dependencies
        run: mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: target/dependency
          severity: HIGH,CRITICAL
          exit-code: '1'

  # --- static application security testing, independent, runs in parallel ---
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # --- secret scanning, independent, runs in parallel ---
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- build the runtime image and scan it, depends on build-and-test ---
  docker-image-scan:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t parking-ticket-service:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: parking-ticket-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  # --- single required status check, depends on every other job ---
  ci-success:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - verify-artifact
      - checkstyle
      - dependency-scan
      - codeql
      - gitleaks
      - docker-image-scan

    steps:
      - name: All checks passed
        run: echo "all jobs succeeded"
